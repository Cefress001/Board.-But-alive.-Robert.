name: Docs Self-Healing Pipeline

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - '**.md'
      - '**.markdown'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  auto-heal-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Head Branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Multi-Stage Linters & Formatters
        run: |
          npx --yes prettier --write "**/*.md"
          npx --yes markdownlint-cli2 --fix "**/*.md" || true

      - name: Commit and Push Verified Corrections
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "style(docs): format markdown via self-healing pipeline [skip ci]"
            git push origin "HEAD:$HEAD_REF"
          else
            echo "All documentation files already meet formatting specifications."
          fi
