name: Docs Self-Healing Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.md'
      - '**/*.mdx'
      - '**/*.markdown'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read                      # Global ceiling stays read-only

jobs:
  verify:
    name: Verify documentation formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      needs_formatting: ${{ steps.check.outputs.needs_formatting }}

    steps:
      - name: Checkout PR Head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false  # No write token in .git/config on read-only job

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        id: check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -uo pipefail
          BASE="origin/$BASE_REF"
          
          mapfile -t FILES < <(
            git diff --name-only --diff-filter=ACMR "$BASE...HEAD" \
              -- '*.md' '*.mdx' '*.markdown' \
              ':!node_modules/**' ':!vendor/**' ':!dist/**' ':!**/generated/**' \
              ':!CHANGELOG.md'
          )

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "needs_formatting=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if npx prettier --check "${FILES[@]}"; then
            echo "needs_formatting=false" >> $GITHUB_OUTPUT
          else
            echo "needs_formatting=true" >> $GITHUB_OUTPUT
          fi

  heal:
    name: Auto-heal documentation
    needs: verify
    # Fork guard: prevents write execution on external PRs
    if: |
      needs.verify.outputs.needs_formatting == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write                 # Minimum required write scope for committing back

    steps:
      - name: Checkout PR Head for Healing
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true   # Required for git-auto-commit-action to push

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply formatters
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -uo pipefail
          BASE="origin/$BASE_REF"
          
          mapfile -t FILES < <(
            git diff --name-only --diff-filter=ACMR "$BASE...HEAD" \
              -- '*.md' '*.mdx' '*.markdown' \
              ':!node_modules/**' ':!vendor/**' ':!dist/**' ':!**/generated/**' \
              ':!CHANGELOG.md'
          )

          if [ ${#FILES[@]} -gt 0 ]; then
            npx prettier --write "${FILES[@]}"
          fi

      - name: Commit and push fixes
        uses: stefanzweifel/git-auto-commit-action@e348103e9026cc0eee322c6dabc5c2cb5ecd1f67 # v5.1.0
        with:
          commit_message: "style(docs): automated markdown normalization [skip ci]"
          commit_options: '--no-verify'
